<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsToDoList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- CABEÇALHO -->
    <header class="bg-blue-600 text-white px-4 py-6 shadow-md">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
                    EsToDoList ☑
                </h1>
                <p class="text-sm text-blue-100 mt-1">
                    Organize suas tarefas com facilidade
                </p>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="w-full max-w-5xl mx-auto px-4 py-6 sm:py-8 flex-1">

        <!-- BUSCA E FILTROS -->
        <section class="mb-8 space-y-4">
            <input
                type="search"
                id="searchTask"
                placeholder="Pesquisar tarefa..."
                class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition"
            >

            <div class="grid grid-cols-3 gap-2">
                <button type="button" class="bg-blue-600 text-white px-3 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition hover:bg-blue-700">
                    Todas
                </button>
                <button type="button" class="bg-white border border-gray-300 text-gray-700 px-3 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-50 transition">
                    Pendentes
                </button>
                <button type="button" class="bg-white border border-gray-300 text-gray-700 px-3 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-50 transition">
                    Concluídas
                </button>
            </div>
        </section>

        <!-- FORMULÁRIO -->
        <section class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6 mb-8 shadow-sm">
            <h2 class="text-lg sm:text-xl font-bold mb-4 text-blue-600">
                Nova Tarefa
            </h2>

            <form class="space-y-4">
                <div>
                    <label for="nomeTarefa" class="block mb-1 text-sm font-medium text-gray-700">Nome da tarefa</label>
                    <input
                        type="text"
                        id="nomeTarefa"
                        placeholder="Ex.: Estudar matemática"
                        class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>

                <div>
                    <label for="descricao" class="block mb-1 text-sm font-medium text-gray-700">Descrição</label>
                    <textarea
                        id="descricao"
                        placeholder="Descreva o que precisa ser feito..."
                        rows="3"
                        class="w-full border border-gray-300 rounded-lg p-3 resize-y outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="categoria" class="block mb-1 text-sm font-medium text-gray-700">Categoria</label>
                        <select id="categoria" class="w-full border border-gray-300 rounded-lg p-3 bg-white outline-none focus:ring-2 focus:ring-blue-500" required>
                            <option value="">Selecione...</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Trabalho">Trabalho</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Projetos">Projetos</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div>
                        <label for="dataPrazo" class="block mb-1 text-sm font-medium text-gray-700">Data de entrega</label>
                        <input type="date" id="dataPrazo" class="w-full border border-gray-300 rounded-lg p-3 bg-white outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <div>
                        <label for="prioridade" class="block mb-1 text-sm font-medium text-gray-700">Prioridade</label>
                        <select id="prioridade" class="w-full border border-gray-300 rounded-lg p-3 bg-white outline-none focus:ring-2 focus:ring-blue-500" required>
                            <option value="">Selecione...</option>
                            <option value="Baixa">Baixa</option>
                            <option value="Média">Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </div>
                </div>

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white w-full sm:w-auto px-6 py-3 rounded-lg font-semibold transition shadow-sm"
                >
                    + Adicionar tarefa
                </button>
            </form>
        </section>

        <!-- LISTA DE TAREFAS -->
        <section>
            <h2 class="text-lg sm:text-xl font-bold mb-4 text-blue-600">
                Minhas Tarefas
            </h2>

            <div id="listaTarefas" class="space-y-4">
                
                <!-- CARD TAREFA -->
                <article class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md transition">
                    <div class="flex flex-col sm:flex-row justify-between items-start gap-4">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-gray-900 text-lg break-words">
                                Estudar matemática
                            </h3>
                            <p class="text-gray-600 text-sm mt-1 break-words">
                                Resolver exercícios de combinação e permutação.
                            </p>
                            <p class="text-xs text-gray-500 mt-3">
                                <span class="font-medium text-gray-700">Prazo:</span> 05/11/2026
                            </p>

                            <div class="flex flex-wrap gap-2 mt-3">
                                <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-md font-medium border border-blue-200">
                                    Estudos
                                </span>
                                <span class="bg-red-50 text-red-700 text-xs px-2.5 py-1 rounded-md font-medium border border-red-200">
                                    Alta prioridade
                                </span>
                                <span class="bg-amber-50 text-amber-700 text-xs px-2.5 py-1 rounded-md font-medium border border-amber-200">
                                    Pendente
                                </span>
                            </div>
                        </div>

                        <button type="button" class="text-sm text-blue-600 font-semibold hover:text-blue-800 transition">
                            Editar
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-5 border-t border-gray-100 pt-4">
                        <button type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white w-full px-4 py-2.5 rounded-lg text-sm font-semibold transition">
                            Concluir tarefa
                        </button>
                        <button type="button" class="bg-red-600 hover:bg-red-700 text-white w-full px-4 py-2.5 rounded-lg text-sm font-semibold transition">
                            Excluir tarefa
                        </button>
                    </div>
                </article>

            </div>
        </section>

    </main>

    <!-- RODAPÉ -->
    <footer class="bg-white border-t border-gray-200 px-4 py-6 text-center mt-8">
        <p class="text-sm text-gray-600">
            EsToDoList © 2026 — Feito por 
            <a href="https://www.linkedin.com/in/melissa-gouv%C3%AAa-17998542a/" target="_blank" class="text-blue-600 hover:underline font-medium">
                Melissa Gomes Gouvêa
            </a>
        </p>
    </footer>

</body>
</html>
